name: node.js

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  FORCE_COLOR: 1
  PRINT_OFFLINE_OUTPUT: 1
  # Hook in tests/mochaHooks.cjs requires this env var to be set; unit tests
  # don't actually call the Serverless API, so a dummy value is sufficient.
  SERVERLESS_ACCESS_KEY: dummy
  # Restrict CI to unit tests (mapped in .mocharc.cjs). Upstream CI also runs
  # e2e + docker integration tests, which need real services this fork
  # doesn't provide in CI.
  TEST: unit

jobs:
  build:
    name: "node.js v${{ matrix.node-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      - run: npm run prettier

      - run: npm run lint

      - run: npm test
